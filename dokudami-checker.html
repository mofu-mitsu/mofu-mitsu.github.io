<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ドクダミ度チェッカー🌿 | もふみつ工房</title>
<meta name="description" content="文章の「ドクダミ度」を成分表示で採点するジョーク診断ツール。一般論・予防線・説教モード・論点すり替え、ポジティブな皮をかぶった管理ムーブまで検出します。">
<style>
  :root{
    --green:#3e7d3a; --green-dark:#2c5c29; --leaf:#e8f3e4; --ink:#2b2b26; --paper:#fbfaf5; --line:#d8d4c4;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;background:var(--paper);color:var(--ink);line-height:1.7;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 16px 56px;}
  header{text-align:center;padding:20px 0 6px;}
  .hero{position:relative;padding:28px 8px 12px;overflow:hidden;}
  .hero .deco{position:absolute;width:52px;height:68px;opacity:.5;pointer-events:none;}
  .hero .d1{left:2%;top:2px;transform:rotate(-10deg);}
  .hero .d2{right:3%;top:0;transform:rotate(9deg);width:62px;height:81px;opacity:.65;}
  .hero .d3{left:12%;bottom:-14px;transform:rotate(14deg);width:38px;height:49px;opacity:.35;}
  .hero .d4{right:13%;bottom:-10px;transform:rotate(-13deg);width:42px;height:55px;opacity:.4;}
  .hero h1,.hero .sub{position:relative;}
  h1{font-size:1.9rem;margin:0 0 6px;letter-spacing:.03em;background:linear-gradient(90deg,#2c5c29,#5da24f,#2c5c29);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .divider{display:flex;justify-content:center;gap:10px;margin-top:12px;}
  .divider svg{width:20px;height:26px;opacity:.55;}
  .sub{color:#6b6b5e;font-size:.92rem;margin:0;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-top:18px;box-shadow:0 2px 8px rgba(60,80,40,.06);}
  textarea{width:100%;min-height:170px;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:1rem;font-family:inherit;resize:vertical;background:#fffef9;}
  textarea:focus{outline:2px solid var(--green);outline-offset:1px;}
  .samples{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px;}
  .samples span{font-size:.82rem;color:#6b6b5e;align-self:center;}
  button{cursor:pointer;border-radius:999px;border:1px solid var(--green);font-family:inherit;}
  .sample-btn{background:var(--leaf);color:var(--green-dark);font-size:.82rem;padding:5px 12px;}
  .sample-btn:hover{background:#dcebd4;}
  .go{display:block;width:100%;margin-top:12px;background:var(--green);color:#fff;font-size:1.1rem;font-weight:700;padding:12px;border:none;}
  .go:hover{background:var(--green-dark);}
  #result{display:none;}
  .score-line{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;}
  .score{font-size:3rem;font-weight:800;color:var(--green-dark);line-height:1;}
  .score small{font-size:1.1rem;color:#8a8a7a;font-weight:600;}
  .verdict{font-size:1.25rem;font-weight:700;}
  .bar{height:16px;background:#eee9da;border-radius:999px;overflow:hidden;margin:12px 0 4px;}
  .bar > div{height:100%;width:0;background:linear-gradient(90deg,#9cc184,#3e7d3a);transition:width .5s ease;}
  .field{background:linear-gradient(#fdfdf8,#eef4e2);border:1px solid var(--line);border-radius:10px;min-height:86px;margin-top:14px;padding:10px 8px 2px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;}
  .field .empty{color:#8a8a7a;font-size:.9rem;padding:8px;}
  .field svg{width:44px;height:57px;}
  .comment{background:#f4f8ee;border-left:4px solid var(--green);padding:10px 12px;border-radius:8px;margin:14px 0 0;font-size:.95rem;}
  .comp{margin-top:10px;}
  .comp h3{font-size:.95rem;margin:12px 0 6px;color:var(--green-dark);}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{background:var(--leaf);border:1px solid #c9dcbc;color:var(--green-dark);border-radius:999px;padding:2px 10px;font-size:.85rem;}
  .none{color:#6b6b5e;font-size:.95rem;}
  .note{font-size:.82rem;color:#8a8a7a;margin-top:16px;}
  footer{text-align:center;color:#8a8a7a;font-size:.82rem;margin-top:28px;}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <g id="dokudami-flower">
      <path d="M50 128 C47 102 53 80 50 54" stroke="#3e7d3a" stroke-width="4" fill="none" stroke-linecap="round"/>
      <path d="M51 106 C39 90 22 94 24 109 C26 122 43 127 51 118 C59 127 76 122 78 109 C80 94 63 90 51 106 Z" fill="#57a047"/>
      <ellipse cx="50" cy="42" rx="13" ry="6" fill="#ffffff" stroke="#cfd8c8"/>
      <ellipse cx="33" cy="47" rx="13" ry="6" transform="rotate(-28 33 47)" fill="#ffffff" stroke="#cfd8c8"/>
      <ellipse cx="67" cy="47" rx="13" ry="6" transform="rotate(28 67 47)" fill="#ffffff" stroke="#cfd8c8"/>
      <ellipse cx="50" cy="55" rx="16" ry="7" fill="#ffffff" stroke="#cfd8c8"/>
      <rect x="45" y="8" width="10" height="34" rx="5" fill="#ecc94b"/>
      <circle cx="50" cy="16" r="1.6" fill="#c9a227"/>
      <circle cx="48" cy="24" r="1.6" fill="#c9a227"/>
      <circle cx="52" cy="31" r="1.6" fill="#c9a227"/>
    </g>
  </defs>
</svg>

<div class="wrap">
  <header>
    <div class="hero">
      <svg class="deco d1" viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
      <svg class="deco d2" viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
      <svg class="deco d3" viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
      <svg class="deco d4" viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
      <h1>🌿 ドクダミ度チェッカー</h1>
      <p class="sub">文章を貼ると、「ドクダミ度」を成分表示で採点します。<br>ドクダミ＝一般論・予防線・正論で話をすり替える、あの生え方。</p>
      <div class="divider">
        <svg viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
        <svg viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
        <svg viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
        <svg viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
        <svg viewBox="0 0 100 130"><use href="#dokudami-flower"/></svg>
      </div>
    </div>
  </header>

  <div class="card">
    <div class="samples">
      <span>サンプル：</span>
      <button class="sample-btn" data-sample="lecture">説教全開の長文（架空）</button>
      <button class="sample-btn" data-sample="positive">ポジティブ管理なLINE（架空）</button>
      <button class="sample-btn" data-sample="ai">AIの予防線たっぷり回答</button>
      <button class="sample-btn" data-sample="nori">ノリのいい返し</button>
    </div>
    <textarea id="input" placeholder="ここに文章を貼ってね"></textarea>
    <button class="go" id="measure">🌿 測る</button>
  </div>

  <div class="card" id="result">
    <div class="score-line">
      <div class="score"><span id="scoreNum">0</span><small> / 100</small></div>
      <div class="verdict" id="verdict"></div>
    </div>
    <div class="bar"><div id="barFill"></div></div>
    <div class="field" id="field"></div>
    <p class="comment"><strong>🌿 チェッカーのひとこと</strong><br><span id="commentText"></span></p>
    <div class="comp" id="components"></div>
    <p class="note">※成分はパターン一致で1回だけ加算されます。「？」が3つ以上あると尋問成分が増えます。ノリ成分（わかる、それな、www等）があると減点されます。点数に応じてドクダミの花が咲きます。</p>
  </div>

  <footer>もふみつ工房 🌿 ドクダミ度チェッカー</footer>
</div>

<script>
var PATTERNS = [
  ["別の話","言い換え・別の課題への変換",14],["あくまで","言い換え・別の課題への変換",14],["そもそも","言い換え・別の課題への変換",14],["それはそれとして","言い換え・別の課題への変換",14],["話を戻すと","言い換え・別の課題への変換",14],
  ["一般的には","一般論・予防線",12],["とは限らない","一般論・予防線",12],["一概には","一般論・予防線",12],["場合によって","一般論・予防線",12],["人によって","一般論・予防線",12],["複数の要因","一般論・予防線",12],["さまざまな要因","一般論・予防線",12],["個人差","一般論・予防線",12],
  ["ただし","ただし系のピボット",14],["なお、","ただし系のピボット",14],["念のため","ただし系のピボット",14],["正確には","ただし系のピボット",14],
  ["すべき","説教・正論モード",14],["した方がいい","説教・正論モード",14],["する必要がある","説教・正論モード",14],["努力","説教・正論モード",14],["改善","説教・正論モード",14],["反省","説教・正論モード",14],["理解した","説教・正論モード",14],["何のために","説教・正論モード",14],["逃げている","説教・正論モード",14],
  ["してみては","頼まれてない改善案・進行管理",12],["お勧め","頼まれてない改善案・進行管理",12],["手順","頼まれてない改善案・進行管理",12],["計画","頼まれてない改善案・進行管理",12],["しましょう","頼まれてない改善案・進行管理",12],["業務","頼まれてない改善案・進行管理",12],["報連相","頼まれてない改善案・進行管理",12],
  ["※","オチ潰しの注意書き",10],["注意","オチ潰しの注意書き",10],
  ["で合ってますか","尋問・細かい確認",12],["いつからで何時","尋問・細かい確認",12],["言ったはず","尋問・細かい確認",12],
  ["😊","ポジティブ管理・称賛圧",10],["継続して","ポジティブ管理・称賛圧",10],["がんばりました","ポジティブ管理・称賛圧",10],["がんばった","ポジティブ管理・称賛圧",10],["偉い","ポジティブ管理・称賛圧",10],["その調子","ポジティブ管理・称賛圧",10],["この調子","ポジティブ管理・称賛圧",10],["聞かせて","ポジティブ管理・称賛圧",10],["きかせて","ポジティブ管理・称賛圧",10]
];
var RIDE_ALONG = ["わかる","それな","確かに","www","いいね","ほんとそれ","載せたい"];

function dokudamiScore(text){
  var hits = [], score = 0, i, p;
  for(i=0;i<PATTERNS.length;i++){
    p = PATTERNS[i];
    if(text.indexOf(p[0]) !== -1){ hits.push([p[1], p[0]]); score += p[2]; }
  }
  if(/まず[\s\S]+次に/.test(text)){ hits.push(["頼まれてない改善案・進行管理","まず…次に"]); score += 12; }
  var q = (text.match(/\?/g)||[]).length + (text.match(/？/g)||[]).length;
  if(q >= 3){ hits.push(["尋問・細かい確認","？×3以上"]); score += 12; }
  var ride = 0;
  for(i=0;i<RIDE_ALONG.length;i++){ if(text.indexOf(RIDE_ALONG[i]) !== -1) ride++; }
  score -= ride * 5;
  score = Math.max(0, Math.min(100, score));
  var verdict;
  if(score < 20) verdict = "ほぼ無害🌱";
  else if(score < 40) verdict = "うっすら生えてる🌿";
  else if(score < 60) verdict = "生えてる🌿🌿";
  else if(score < 80) verdict = "濃いめ🌿🌿🌿";
  else verdict = "測定不能級🌿🌿🌿🌿";
  return {score:score, verdict:verdict, hits:hits, ride:ride};
}

var SAMPLES = {
  lecture: "お疲れ様です。まず確認ですが、明日の予定は何時からですか？何のためにやるのか、理解した上で進めてください。社会人であれば、報連相等の義務は果たしてください。休むことはほかの一緒に働く人へも影響があります。それを逃げているように思えます。今の努力が今後に繋がります。内定はゴールではなくスタートです。これらの点をふまえて、ご判断ください。",
  positive: "おはようございます！すごい！偉いです😊 共有もありがとうございます。報告ですね！ぜひ継続してください。今はもう帰り道かな？ がんばったね。感想あとできかせてもらえると嬉しいです😊",
  ai: "AIの応答傾向は、複数の要因によって形成されます。一般的には、タイプの判断には慎重さが求められます。",
  nori: "ほんとそれwww LSEの教科書に載せたいレベル。わかるわかる。"
};

document.querySelectorAll(".sample-btn").forEach(function(btn){
  btn.addEventListener("click", function(){
    document.getElementById("input").value = SAMPLES[btn.getAttribute("data-sample")];
    measure();
  });
});

function renderField(score){
  var field = document.getElementById("field");
  field.innerHTML = "";
  if(score <= 0){
    var s = document.createElement("span");
    s.className = "empty";
    s.textContent = "まだ生えてない 🌱";
    field.appendChild(s);
    return;
  }
  var n = Math.ceil(score / 10);
  for(var i=0;i<n;i++){
    var svg = document.createElementNS("http://www.w3.org/2000/svg","svg");
    svg.setAttribute("viewBox","0 0 100 130");
    var use = document.createElementNS("http://www.w3.org/2000/svg","use");
    use.setAttribute("href","#dokudami-flower");
    svg.appendChild(use);
    field.appendChild(svg);
  }
}

function makeComment(r){
  if(r.score <= 0) return "平和そのもの。ドクダミの気配ゼロです。";
  var lines = {
    "言い換え・別の課題への変換":"主成分は話のすり替え。聞かれたことには答えず、別の課題に着地するタイプ。",
    "一般論・予防線":"予防線の張り方が丁寧。一般論という名の保険をかけすぎ。",
    "ただし系のピボット":"「ただし」で風向きを変える癖が強い。ピボット職人。",
    "説教・正論モード":"説教モードが主成分。先生か上司の香りがします。",
    "頼まれてない改善案・進行管理":"頼まれてもいないのに進行管理が始まっています。段取りの圧。",
    "オチ潰しの注意書き":"オチの前に注意書きで空気を冷ますタイプ。",
    "尋問・細かい確認":"質問の圧が強め。もはや取り調べ。",
    "ポジティブ管理・称賛圧":"褒めてるのに、しっかり管理されている感じがする。ニコニコ圧の使い手。"
  };
  var counts = {}, order = [];
  r.hits.forEach(function(h){ if(!counts[h[0]]){ counts[h[0]] = 0; order.push(h[0]); } counts[h[0]]++; });
  var dom = order[0], best = 0;
  order.forEach(function(n){ if(counts[n] > best){ best = counts[n]; dom = n; } });
  var msg = lines[dom] || "";
  if(counts["ポジティブ管理・称賛圧"] && counts["説教・正論モード"]) msg = "褒めてから説教する二段構え。飴と鞭の配合がプロ。";
  if(r.score >= 100) msg += " ここまで来ると庭ではなく群生地です。";
  else if(r.score >= 80) msg += " かなり濃い。抜いても抜いても生えてきそう。";
  if(r.ride >= 3) msg += " ただ、ノリ成分でだいぶ相殺されてます。";
  return msg;
}

function measure(){
  var text = document.getElementById("input").value;
  var box = document.getElementById("result");
  if(!text.trim()){ box.style.display = "none"; return; }
  var r = dokudamiScore(text);
  document.getElementById("scoreNum").textContent = r.score;
  document.getElementById("verdict").textContent = r.verdict;
  document.getElementById("barFill").style.width = r.score + "%";
  renderField(r.score);
  document.getElementById("commentText").textContent = makeComment(r);
  var comp = document.getElementById("components");
  comp.innerHTML = "";
  if(r.hits.length === 0){
    var p = document.createElement("p");
    p.className = "none";
    p.textContent = "（成分なし。ちゃんと話に乗ってる）";
    comp.appendChild(p);
  } else {
    var groups = {}, order = [];
    r.hits.forEach(function(h){
      if(!groups[h[0]]){ groups[h[0]] = []; order.push(h[0]); }
      groups[h[0]].push(h[1]);
    });
    order.forEach(function(name){
      var h3 = document.createElement("h3");
      h3.textContent = "🌿 " + name;
      comp.appendChild(h3);
      var chips = document.createElement("div");
      chips.className = "chips";
      groups[name].forEach(function(pat){
        var c = document.createElement("span");
        c.className = "chip";
        c.textContent = pat;
        chips.appendChild(c);
      });
      comp.appendChild(chips);
    });
  }
  if(r.ride > 0){
    var h3r = document.createElement("h3");
    h3r.textContent = "🌱 ノリ成分あり（-" + (r.ride*5) + "）";
    comp.appendChild(h3r);
  }
  box.style.display = "block";
  box.scrollIntoView({behavior:"smooth", block:"nearest"});
}
document.getElementById("measure").addEventListener("click", measure);
</script>
</body>
</html>
